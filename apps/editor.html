<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:#1a1a2e;color:#ccc;font-family:monospace;height:100%;display:flex;flex-direction:column}
.editor-header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#252542;border-bottom:1px solid #333;flex-shrink:0}
.editor-header .filename{flex:1;color:#fa7;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor-header button{background:#3a3a5c;border:none;color:#ccc;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.editor-header button:hover{background:#4a4a7c}
.editor-header .save-btn{background:#2a6a3a}
.editor-header .save-btn:hover{background:#3a8a4a}
.editor-header .save-btn.saving{background:#6a6a3a;opacity:0.7}
textarea{flex:1;background:#0d0d1a;color:#8f8;border:none;outline:none;padding:10px;font-size:13px;font-family:monospace;resize:none;tab-size:2;line-height:1.5}
textarea:focus{outline:none}
#editor-status{font-size:11px;color:#666;padding:2px 10px;text-align:right;flex-shrink:0}
</style></head><body>
<div class="editor-header">
  <span class="filename" id="filename">📄 new file</span>
  <button class="save-btn" id="btn-save">💾 Save</button>
  <button id="btn-close">✕</button>
</div>
<textarea id="editor-area" placeholder="Start typing..."></textarea>
<div id="editor-status"></div>
<script>
const FILE_API = '/file-api/api';
let currentPath = '';

// Save file
document.getElementById('btn-save').onclick = function() {
  const btn = this;
  if (!currentPath) {
    const name = prompt('File name (relative to ' + window._editorBasePath || '/var/www/html/neuro-os/user' + '):');
    if (!name) return;
    const base = window._editorBasePath || '/var/www/html/neuro-os/user';
    currentPath = base.replace(/\/$/, '') + '/' + name.replace(/^\//, '');
    document.getElementById('filename').textContent = '📄 ' + name;
  }
  const text = document.getElementById('editor-area').value;
  btn.textContent = '⏳ Saving...';
  btn.classList.add('saving');
  fetch(FILE_API + '/write?path=' + encodeURIComponent(currentPath), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: text
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      btn.textContent = '✅ Saved';
      document.getElementById('editor-status').textContent = new Date().toLocaleTimeString() + ' — saved';
      setTimeout(() => { btn.textContent = '💾 Save'; btn.classList.remove('saving'); }, 2000);
    } else {
      btn.textContent = '❌ Error';
      setTimeout(() => { btn.textContent = '💾 Save'; btn.classList.remove('saving'); }, 3000);
    }
  })
  .catch(err => {
    btn.textContent = '❌ Error';
    document.getElementById('editor-status').textContent = 'Error: ' + err.message;
    setTimeout(() => { btn.textContent = '💾 Save'; btn.classList.remove('saving'); }, 3000);
  });
};

// Close
document.getElementById('btn-close').onclick = function() {
  if (window.channel) {
    channel.send({ event: 'app.click', id: window._editorWinId || 'editor', target: 'close', value: '' });
  }
  // Fallback: remove window if wm available
  if (typeof wm !== 'undefined' && window._editorWinId) {
    wm.close(window._editorWinId);
  }
};

// Load file if path provided via URL param or global
function loadFile(filePath) {
  currentPath = filePath;
  const name = filePath.split('/').pop();
  document.getElementById('filename').textContent = '📄 ' + name;
  document.getElementById('editor-status').textContent = 'Loading...';
  fetch(FILE_API + '/read?path=' + encodeURIComponent(filePath))
    .then(r => {
      if (!r.ok) throw new Error('Cannot read');
      return r.text();
    })
    .then(content => {
      document.getElementById('editor-area').value = content;
      document.getElementById('editor-status').textContent = 'Loaded ' + name;
    })
    .catch(err => {
      document.getElementById('editor-area').value = '// Error loading: ' + err.message;
      document.getElementById('editor-status').textContent = 'Error';
    });
}

// Check for file in URL params
const params = new URLSearchParams(window.location.search);
const fileParam = params.get('file');
if (fileParam) loadFile(fileParam);

// Expose for external use
window._editorLoadFile = loadFile;

// Auto-resize textarea
function resize() {
  var ta = document.getElementById('editor-area');
  ta.style.height = (window.innerHeight - 52) + 'px';
}
window.onresize = resize;
setTimeout(resize, 100);
</script>
</body></html>
